name: Test basic usage with default config path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action is a governance bot designed for issues/pull_request events.
      # For workflow_dispatch, the ignore() function hits the "catch all" branch
      # and returns true, so the action exits cleanly without fetching the config.
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config-path: tests/fixtures/governance-minimal.yml
        continue-on-error: true

      - name: Assert action completed successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed for workflow_dispatch event, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action ran successfully with default config path"
