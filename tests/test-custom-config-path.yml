name: Test custom config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run OSS Governance Bot with custom config path pointing to fixture
        uses: .
        with:
          github-token: ${{ github.token }}
          config-path: tests/fixtures/governance.yml
        continue-on-error: true

      - name: Assert action completed successfully with custom config path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch, the action hits the catch-all ignore rule
          # in ignore.ts and exits cleanly without reading the config file.
          # The custom config-path input is accepted but never fetched.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with custom config path"
          else
            echo "FAIL: expected success but got: $OUTCOME"
            exit 1
          fi
