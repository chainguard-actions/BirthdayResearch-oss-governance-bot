name: Test minimal config with only version field
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # For workflow_dispatch events, the action's ignore() function hits the
      # catch-all and returns true (ignore), so the action exits early without
      # fetching or validating the config. This verifies the action handles
      # non-issue/PR events gracefully.
      - id: action
        uses: .
        with:
          config-path: .github/governance.yml
          github-token: ${{ github.token }}

      - name: Assert action completed successfully with minimal config
        run: |
          echo "Action completed without error"
          echo "PASS: action ran successfully and ignored workflow_dispatch event (catch-all)"
